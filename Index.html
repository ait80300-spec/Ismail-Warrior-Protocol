<style>
  :root {
    --bg: #0e0e10;
    --bg-elev: #18181b;
    --bg-card: #1c1c20;
    --bg-input: #232328;
    --border: #2a2a30;
    --border-strong: #3a3a42;
    --text: #ebebef;
    --text-dim: #8a8a92;
    --text-faint: #5a5a62;
    --accent: #c8543b;
    --accent-dim: #8a3a28;
    --gold: #c9a14a;
    --success: #4a9b6e;
    --danger: #c14848;
    --warning: #d4a235;
    --info: #5a8aaf;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; }
  html, body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif; font-size: 15px; line-height: 1.5; min-height: 100vh; overscroll-behavior: none; -webkit-font-smoothing: antialiased; }
  body { padding: 0 0 100px 0; max-width: 600px; margin: 0 auto; padding-top: env(safe-area-inset-top); }
  button, input, textarea, select { font-family: inherit; font-size: inherit; color: inherit; }
  input, textarea, select { background: var(--bg-input); border: 1px solid var(--border); color: var(--text); padding: 10px 12px; border-radius: 8px; width: 100%; outline: none; }
  input:focus, textarea:focus, select:focus { border-color: var(--accent-dim); }
  textarea { resize: vertical; min-height: 80px; font-family: inherit; }
  button { background: var(--bg-input); border: 1px solid var(--border); color: var(--text); padding: 10px 14px; border-radius: 8px; cursor: pointer; font-weight: 500; transition: all 0.15s; }
  button:active { transform: scale(0.97); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.ghost { background: transparent; border-color: var(--border); }

  /* HEADER */
  .header { position: sticky; top: 0; background: rgba(14,14,16,0.95); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-bottom: 1px solid var(--border); padding: 12px 16px 10px; z-index: 100; }
  .header-row { display: flex; justify-content: space-between; align-items: center; }
  .header-brand { display: flex; align-items: center; gap: 8px; }
  .header-icon { font-size: 18px; color: var(--accent); }
  .header-title { font-size: 11px; letter-spacing: 2.5px; color: var(--text-dim); font-weight: 700; text-transform: uppercase; }
  .header-streak { font-size: 12px; color: var(--gold); font-weight: 600; display: flex; align-items: center; gap: 4px; }
  .header-day-row { display: flex; justify-content: space-between; align-items: baseline; margin-top: 6px; }
  .header-day { font-size: 22px; font-weight: 700; color: #fff; letter-spacing: -0.5px; }
  .header-date { font-size: 12px; color: var(--text-dim); }
  .progress-bar { height: 3px; background: var(--border); border-radius: 2px; margin-top: 10px; overflow: hidden; }
  .progress-fill { height: 100%; background: linear-gradient(90deg, var(--accent), var(--gold)); transition: width 0.5s; border-radius: 2px; }

  /* DAY NAVIGATOR */
  .day-nav { display: flex; gap: 6px; padding: 12px 16px; overflow-x: auto; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
  .day-nav::-webkit-scrollbar { display: none; }
  .day-pill { flex-shrink: 0; min-width: 42px; height: 52px; border-radius: 10px; background: var(--bg-card); border: 1px solid var(--border); display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; transition: all 0.15s; }
  .day-pill.active { background: var(--accent); border-color: var(--accent); }
  .day-pill.done { border-color: var(--success); background: rgba(74,155,110,0.12); }
  .day-pill.today { border-color: var(--gold); }
  .day-pill-label { font-size: 9px; color: var(--text-faint); letter-spacing: 0.5px; text-transform: uppercase; font-weight: 600; }
  .day-pill.active .day-pill-label { color: rgba(255,255,255,0.8); }
  .day-pill-num { font-size: 16px; font-weight: 700; color: var(--text); margin-top: 2px; }
  .day-pill.active .day-pill-num { color: #fff; }

  /* TABS */
  .tabs { display: flex; gap: 4px; padding: 0 12px 8px; overflow-x: auto; scrollbar-width: none; }
  .tabs::-webkit-scrollbar { display: none; }
  .tab { flex-shrink: 0; padding: 8px 14px; background: transparent; border: 1px solid transparent; border-radius: 20px; font-size: 13px; color: var(--text-dim); font-weight: 600; cursor: pointer; white-space: nowrap; }
  .tab.active { background: var(--bg-card); border-color: var(--border-strong); color: var(--text); }
  .tab-icon { margin-right: 4px; }

  /* CONTENT */
  .content { padding: 4px 16px 20px; }
  .section { display: none; }
  .section.active { display: block; animation: fadein 0.25s ease; }

let state = JSON.parse(localStorage.getItem('warrior_state') || 'null') || {

function save() {
  localStorage.setItem('warrior_state', JSON.stringify(state));
}

function getDayState(day) {
  if (!state.days[day]) {
    state.days[day] = {
      workoutDone: false,
      mealsDone: { 1: false, 2: false, 3: false },
      suppMorning: false, suppNoon: false, suppEvening: false,
      cigarettes: 0,
      alcoholUnits: 0,
      sleep: 7,
      energy: 5,
      mood: 5,
      cravingAlc: 5,
      cravingCig: 5,
      weight: null,
      steps: null,
      photoTaken: false,
      fastingStartTime: null,
      notes: ''
    };
  }
  return state.days[day];
}

// ============ RENDERING ============
function getQuoteForDay(d) { return QUOTES[(d - 1) % QUOTES.length]; }

function getDayName(d) {
  const date = new Date(state.startDate);
  date.setDate(date.getDate() + (d - 1));
  return DAYS_OF_WEEK[(date.getDay() + 6) % 7];
}

function getDayDate(d) {
  const date = new Date(state.startDate);
  date.setDate(date.getDate() + (d - 1));
  return date.toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'short' });
}

function renderDayNav() {
  const nav = document.getElementById('dayNav');
  let html = '';
  for (let i = 1; i <= 28; i++) {
    const ds = state.days[i];
    const done = ds && ds.workoutDone;
    const isToday = i === currentDay;
    const cls = `day-pill ${isToday ? 'active' : ''} ${done ? 'done' : ''}`;
    html += `<div class="${cls}" onclick="setDay(${i})">
      <div class="day-pill-label">J${i}</div>
      <div class="day-pill-num">S${DAYS[i-1].week}</div>
    </div>`;
  }
  nav.innerHTML = html;
}

function setDay(d) {
  currentDay = d;
  state.currentDay = d;
  save();
  renderAll();
  // scroll active pill into view
  const pill = document.querySelectorAll('.day-pill')[d-1];
  if (pill) pill.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
}

function setTab(t) {
  currentTab = t;
  document.querySelectorAll('.tab').forEach(el => el.classList.toggle('active', el.dataset.tab === t));
  document.querySelectorAll('.section').forEach(el => el.classList.toggle('active', el.id === 'section-' + t));
  document.querySelectorAll('.botnav-btn').forEach(el => el.classList.toggle('active', el.dataset.bnav === t));
  renderSection(t);
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

document.querySelectorAll('.tab').forEach(el => el.addEventListener('click', () => setTab(el.dataset.tab)));

function renderHeader() {
  const day = DAYS[currentDay - 1];
  document.getElementById('dayTitle').textContent = `Jour ${currentDay} — Semaine ${day.week}`;
  document.getElementById('dayDate').textContent = getDayDate(currentDay);
  const progress = (currentDay / 28) * 100;
  document.getElementById('progressFill').style.width = progress + '%';
  // streak
  let streak = 0;
  for (let i = currentDay; i >= 1; i--) {
    if (state.days[i] && state.days[i].workoutDone) streak++;
    else break;
  }
  document.getElementById('streakDisplay').textContent = `🔥 ${streak} jour${streak > 1 ? 's' : ''}`;
}

function renderFast() {
  const day = DAYS[currentDay - 1];
  const ds = getDayState(currentDay);
  const now = new Date();
  const fastStartHour = parseInt(day.fastStart.split(':')[0]);
  const fastEndHour = parseInt(day.fastEnd.split(':')[0]);
  const currentHour = now.getHours() + now.getMinutes()/60;

  // Calcul si on est en jeûne ou en fenêtre alim
  let inEating = false;
  if (fastEndHour < fastStartHour) {
    inEating = currentHour >= fastEndHour && currentHour < fastStartHour;
  } else {
    inEating = currentHour >= fastEndHour || currentHour < fastStartHour;
  }

  // Calcul durée jeûne en cours
  let fastDuration = 0;
  let nextEvent = '';
  let nextTime = '';
  if (inEating) {
    nextEvent = 'Prochain jeûne';
    nextTime = day.fastStart;
    const hoursLeft = (fastStartHour - currentHour + 24) % 24;
    fastDuration = 0;
  } else {
    nextEvent = 'Prochaine fenêtre alimentaire';
    nextTime = day.fastEnd;
    // calcul depuis fastStart hier ou aujourd'hui
    if (currentHour >= fastStartHour) {
      fastDuration = currentHour - fastStartHour;
    } else {
      fastDuration = (24 - fastStartHour) + currentHour;
    }
  }

  const fastTotalHours = 16;
  const fastProgress = Math.min(fastDuration / fastTotalHours, 1);
  const circumference = 2 * Math.PI * 72;
  const offset = circumference - (fastProgress * circumference);

  const fastH = Math.floor(fastDuration);
  const fastM = Math.floor((fastDuration - fastH) * 60);

  let html = `
    <div class="card">
      <div class="card-title"><span class="card-title-icon">⏱</span>Jeûne intermittent 16:8</div>

      <div class="fast-display">
        <div class="fast-status">${inEating ? '🍽 Fenêtre alimentaire' : '🌙 En jeûne'}</div>

      <div class="fast-ring">
        <svg width="160" height="160" viewBox="0 0 160 160">
          <circle class="fast-ring-bg" cx="80" cy="80" r="72"></circle>
          <circle class="fast-ring-fill" cx="80" cy="80" r="72" stroke-dasharray="${circumference}" stroke-dashoffset="${inEating ? circumference : offset}"></circle>
        </svg>
        <div class="fast-ring-content">
          <div class="fast-ring-time">${inEating ? '🍽' : fastH + 'h' + (fastM < 10 ? '0' : '') + fastM}</div>
          <div class="fast-ring-label">${inEating ? 'À TABLE' : 'EN JEÛNE'}</div>
        </div>
      </div>

      <div class="fast-info center mt-12">
        <p><b>${nextEvent}</b> à <span class="text-gold">${nextTime}</span></p>
      </div>
    </div>

    <div class="card">
      <div class="card-title"><span class="card-title-icon">📅</span>Horaires du jour</div>
      <div style="display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--border)">
        <span>Début fenêtre alimentaire</span>
        <span class="text-gold" style="font-weight:700">${day.fastEnd}</span>
      </div>
      <div style="display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--border)">
        <span>Fin fenêtre alimentaire</span>
        <span class="text-gold" style="font-weight:700">${day.fastStart}</span>
      </div>
      <div style="display:flex;justify-content:space-between;padding:10px 0">
        <span>Durée fenêtre</span>
        <span class="text-gold" style="font-weight:700">8h</span>
      </div>
    </div>

    <div class="card">
      <div class="card-title"><span class="card-title-icon">💡</span>Règles jeûne</div>
      <div class="small" style="line-height:1.8">
        <p>✅ <b>Autorisé pendant le jeûne :</b> eau, café noir, thé sans sucre, sel + électrolytes</p>
        <p>❌ <b>Interdit :</b> tout aliment, lait, jus, sodas, gommes sucrées, compléments avec calories</p>

function renderTracking() {
  // collecter données
  const weights = [], energy = [], mood = [], sleep = [], cigs = [], alc = [];
  for (let i = 1; i <= 28; i++) {
    const d = state.days[i];
    if (d) {
      if (d.weight) weights.push({ day: i, val: parseFloat(d.weight) });
      energy.push({ day: i, val: parseFloat(d.energy) });
      mood.push({ day: i, val: parseFloat(d.mood) });
      sleep.push({ day: i, val: parseFloat(d.sleep) });
      cigs.push({ day: i, val: parseInt(d.cigarettes) });
      alc.push({ day: i, val: parseInt(d.alcoholUnits) });
    }
  }

  function renderChart(data, color, label, unit = '') {
    if (data.length < 1) return `<div class="small text-dim">Aucune donnée encore</div>`;
    const max = Math.max(...data.map(d => d.val), 1);
    const w = 100 / 28;
    let bars = '';
    for (let i = 1; i <= 28; i++) {
      const d = data.find(x => x.day === i);
      const h = d ? (d.val / max) * 100 : 0;
      const cur = i === currentDay;
      bars += `<div style="flex:1;display:flex;align-items:flex-end;height:80px;padding:0 1px"><div style="width:100%;background:${cur ? 'var(--accent)' : color};height:${h}%;border-radius:2px 2px 0 0;min-height:${d ? '2px' : '0'};opacity:${d ? 1 : 0.3}"></div></div>`;
    }
    const last = data[data.length - 1];
    const first = data[0];
    const delta = last && first ? (last.val - first.val).toFixed(1) : 0;
    return `
      <div class="chart-box">
        <div class="chart-title">${label} ${last ? `— ${last.val}${unit}` : ''} ${delta != 0 ? `<span style="float:right;color:${delta > 0 ? 'var(--success)' : 'var(--danger)'}">${delta > 0 ? '+' : ''}${delta}</span>` : ''}</div>
        <div style="display:flex;height:80px;gap:1px">${bars}</div>
        <div style="display:flex;justify-content:space-between;font-size:9px;color:var(--text-faint);margin-top:4px"><span>J1</span><span>J14</span><span>J28</span></div>
      </div>
    `;
  }

  // Stats sommaires
  const totalWorkouts = Object.values(state.days).filter(d => d.workoutDone).length;
  const totalDays = Object.keys(state.days).length;
  const totalCigs = cigs.reduce((a, b) => a + b.val, 0);
  const totalAlc = alc.reduce((a, b) => a + b.val, 0);

  let html = `
    <div class="card">
      <div class="card-title"><span class="card-title-icon">📊</span>Progression globale</div>
      <div class="stat-grid">
        <div class="stat-box">
          <div class="stat-label">Séances faites</div>
          <div class="stat-value">${totalWorkouts}<span class="stat-unit">/28</span></div>
        </div>
        <div class="stat-box">
          <div class="stat-label">Jours suivis</div>
          <div class="stat-value">${totalDays}<span class="stat-unit">/28</span></div>
        </div>
        <div class="stat-box">
          <div class="stat-label">Cigarettes total</div>
          <div class="stat-value">${totalCigs}</div>
        </div>
        <div class="stat-box">
          <div class="stat-label">Unités alc total</div>
          <div class="stat-value">${totalAlc}</div>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="card-title"><span class="card-title-icon">📈</span>Courbes 28 jours</div>
      ${renderChart(weights, 'var(--accent)', 'Poids (kg)', 'kg')}
      ${renderChart(sleep, 'var(--info)', 'Sommeil (h)', 'h')}
      ${renderChart(energy, 'var(--gold)', 'Énergie /10')}
      ${renderChart(mood, 'var(--success)', 'Humeur /10')}
      ${renderChart(cigs, 'var(--danger)', 'Cigarettes/jour')}
      ${renderChart(alc, '#a06b35', 'Unités alcool/jour')}
    </div>

    <div class="card">
      <div class="card-title"><span class="card-title-icon">📦</span>Export / Reset</div>
      <button class="ghost" style="width:100%" onclick="exportData()">💾 Exporter mes données (JSON)</button>
      <button class="ghost mt-12" style="width:100%" onclick="if(confirm('Effacer toutes les données ?')) { state.days = {}; save(); renderAll(); }">🗑 Reset toutes les données</button>
    </div>
  `;
  document.getElementById('section-tracking').innerHTML = html;
}

  for (let i = 28; i >= 1; i--) {
    const d = state.days[i];
    if (d && d.notes && d.notes.trim()) {
      entries += `<div class="note-entry">
        <div class="note-entry-date">Jour ${i} — ${getDayDate(i)}</div>
        <div class="note-entry-text">${d.notes.replace(/</g, '&lt;')}</div>
      </div>`;
    }
  }

  let html = `
    <div class="card">
      <div class="card-title"><span class="card-title-icon">✍️</span>Notes du jour ${currentDay}</div>
      <p class="small text-dim mb-12">Réfléchis aux 4 questions warrior :</p>
      <ol style="font-size:12px;color:var(--text-dim);padding-left:20px;line-height:1.8;margin-bottom:12px">
        <li>Qu'as-tu bien fait aujourd'hui ? (3 trucs)</li>
        <li>Qu'as-tu évité par lâcheté ?</li>
        <li>Qu'est-ce qui t'a déclenché un craving ?</li>
        <li>3 priorités pour demain</li>
      </ol>
      <textarea class="note-input" placeholder="Écris ici... Tout est sauvegardé automatiquement." oninput="saveNote(this.value)">${ds.notes || ''}</textarea>
      <div class="note-saved" id="noteSaved">✓ Sauvegardé</div>
    </div>

    ${entries ? `<div class="card">
      <div class="card-title"><span class="card-title-icon">📚</span>Mes notes précédentes</div>
      ${entries}
    </div>` : ''}
  `;
  document.getElementById('section-notes').innerHTML = html;
}

function renderSection(t) {
  if (t === 'today') renderToday();
  else if (t === 'workout') renderWorkout();
  else if (t === 'nutrition') renderNutrition();
  else if (t === 'fast') renderFast();
  else if (t === 'sevrage') renderSevrage();
  else if (t === 'tracking') renderTracking();
  else if (t === 'notes') renderNotes();
  else if (t === 'info') renderInfo();
}

function renderAll() {
  renderHeader();
  renderDayNav();
  renderSection(currentTab);
}

// ============ ACTIONS ============
function toggleField(f) {
  const ds = getDayState(currentDay);
  ds[f] = !ds[f];
  save();
  renderAll();
}

function setField(f, v) {
  const ds = getDayState(currentDay);
  ds[f] = v;
  save();
  // pas de full renderAll pour éviter perte focus
  renderHeader();
}

function toggleMeal(n) {
  const ds = getDayState(currentDay);
  ds.mealsDone[n] = !ds.mealsDone[n];
  save();
  renderAll();
}

function counterChange(field, delta) {
  const ds = getDayState(currentDay);
  ds[field] = Math.max(0, (parseInt(ds[field]) || 0) + delta);
  save();
  renderSection(currentTab);
  renderHeader();
}

let saveTimeout;
function saveNote(text) {
  const ds = getDayState(currentDay);
  ds.notes = text;
  clearTimeout(saveTimeout);
  saveTimeout = setTimeout(() => {
    save();
    const el = document.getElementById('noteSaved');
    if (el) { el.classList.add('show'); setTimeout(() => el.classList.remove('show'), 1500); }
  }, 300);
}

function openModal(html) {
  document.getElementById('modalContent').innerHTML = html;
  document.getElementById('modalBg').classList.add('show');
}
function closeModal() {
  document.getElementById('modalBg').classList.remove('show');
}

}

function exportData() {
  const data = JSON.stringify(state, null, 2);
  const blob = new Blob([data], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `warrior_data_${new Date().toISOString().split('T')[0]}.json`;
  a.click();
}

function resetStartDate() {
  const date = prompt('Date de début (YYYY-MM-DD)', state.startDate);
  if (date && /^\d{4}-\d{2}-\d{2}$/.test(date)) {
    state.startDate = date;
    save();
    renderAll();
  }
}

// auto-detect current day based on start date
function autoDetectDay() {
  const start = new Date(state.startDate);
  const now = new Date();
  const diff = Math.floor((now - start) / (1000 * 60 * 60 * 24));
  if (diff >= 0 && diff < 28) {
    currentDay = diff + 1;
    state.currentDay = currentDay;
  }
}

autoDetectDay();
renderAll();

// rafraîchir le timer de jeûne toutes les minutes
setInterval(() => { if (currentTab === 'fast') renderFast(); }, 60000);
